<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Answer the Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700&display=swap">
<style>
  /* ============================================================
     BuildYourStore — "Answer the call" step
     Structure mirrors the Dropship Stores screen 1:1.
     Brand tokens taken from buildyourstore.ai / app.buildyourstore.ai
     ============================================================ */
  :root{
    --pink:#ff0061;
    --pink-dark:#e20056;
    --teal:#009a7b;
    --teal-80:#007069;
    --teal-light:#e1f2ea;
    --green:#5ce099;

    --ink:#0c1413;
    --ink-soft:#4f5d59;
    --ink-faint:#7d8a86;
    --surface:#ffffff;

    --ground-1:#f6fbb2;
    --ground-2:#d6f7c2;
    --ground-3:#b3efdc;
    --ground-4:#a6e6f6;

    --radius-ctl:12px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:var(--ground-2);
    background-image:linear-gradient(107deg,var(--ground-1) 0%,var(--ground-2) 34%,var(--ground-3) 66%,var(--ground-4) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* centred logo, exactly as on the reference screen */
  .brand{display:flex;justify-content:center;padding:26px 16px 0}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none}
  .logo svg{display:block;flex:none}
  .logo-word{font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink);line-height:1;white-space:nowrap}
  .logo-word em{font-style:normal;color:var(--teal)}

  /* one narrow, vertically centred column — no card */
  .page{
    min-height:calc(100% - 60px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding-inline:16px;
    padding-block:32px 48px;
  }
  .col{width:100%;max-width:460px}

  .eyebrow{
    display:inline-block;
    padding:7px 16px;border-radius:99px;
    background:var(--teal-light);color:var(--teal-80);
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  }

  h1{
    margin:16px 0 0;
    font-size:clamp(28px,6.6vw,36px);
    font-weight:700;letter-spacing:-.02em;line-height:1.1;
    text-wrap:balance;
  }
  h1 .ring{
    display:inline-block;vertical-align:-2px;margin-right:9px;
    color:var(--teal);
    animation:ring 1.6s ease-in-out infinite;
    transform-origin:50% 70%;
  }
  @keyframes ring{
    0%,62%,100%{transform:rotate(0)}
    68%{transform:rotate(-14deg)}
    74%{transform:rotate(12deg)}
    80%{transform:rotate(-8deg)}
    86%{transform:rotate(6deg)}
  }

  /* ---------- video ---------- */
  .player{
    position:relative;margin-top:22px;
    aspect-ratio:16/9;width:100%;max-width:100%;
    border-radius:12px;overflow:hidden;
    background:#0e1a24;
    cursor:pointer;display:block;
    color:#fff;
  }
  .player-video{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;display:block;
  }
  /* The brand artwork covers the video until the first play, so the frame is
     never black while we have no poster image. */
  .player-art{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 22% 18%, rgba(92,224,153,.34), transparent 58%),
      radial-gradient(100% 80% at 82% 78%, rgba(0,154,123,.42), transparent 60%),
      linear-gradient(160deg,#122430,#0b151d);
    transition:opacity .25s ease;
  }
  .player-art::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 45% at 50% 42%, rgba(255,255,255,.10), transparent 70%);
  }
  .player.started .player-art{opacity:0}
  .player-copy{
    position:absolute;left:0;right:0;bottom:16%;
    font-size:clamp(13px,3vw,17px);font-weight:600;letter-spacing:-.01em;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
    padding-inline:16px;
    transition:opacity .25s ease;
  }
  .player.started .player-copy{opacity:0}
  /* The play control stays visible until playback starts. It must not depend on
     :hover — there is no hover on touch, and an invisible control on mobile
     means a video that is never played and a CTA that never unlocks. */
  .playbtn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:64px;height:64px;border-radius:50%;border:0;padding:0;
    background:rgba(255,255,255,.18);color:#fff;
    backdrop-filter:blur(2px);
    display:grid;place-items:center;cursor:pointer;
    transition:opacity .18s ease,background .18s ease;
  }
  .playbtn:hover{background:rgba(255,255,255,.28)}
  .playbtn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
  .player.playing .playbtn{opacity:0;pointer-events:none}
  .track{
    position:absolute;left:0;right:0;bottom:0;height:7px;
    background:rgba(255,255,255,.18);
  }
  .track i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--teal),var(--green));
    transition:width .25s linear;
  }

  /* ---------- CTA ---------- */
  .cta{
    margin-top:14px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:17px 24px;border:0;border-radius:var(--radius-ctl);
    font-family:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;
    background:rgba(12,20,19,.07);color:var(--ink-faint);
    cursor:not-allowed;
    transition:background .2s ease,color .2s ease,transform .12s ease,box-shadow .2s ease;
  }
  .cta .lock{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:99px;
    background:rgba(12,20,19,.09);
    font-size:13px;font-variant-numeric:tabular-nums;
  }
  .cta[data-state="unlocked"]{
    background:var(--pink);color:#fff;cursor:pointer;
    box-shadow:0 12px 26px -12px rgba(255,0,97,.9);
  }
  .cta[data-state="unlocked"]:hover{background:var(--pink-dark)}
  .cta[data-state="unlocked"]:active{transform:translateY(1px)}
  .cta[data-state="unlocked"] .lock{display:none}
  .cta:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

  /* ---------- three reassurance points ---------- */
  .points{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
    margin-top:34px;
  }
  .point{display:flex;flex-direction:column;align-items:center;gap:8px}
  .point svg{color:var(--teal);flex:none}
  .point p{margin:0;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ink-soft);text-wrap:balance}

  @media (max-width:520px){
    .brand{padding-top:20px}
    .points{gap:18px}
    .point p{font-size:12px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="brand">
  <a class="logo" href="#" aria-label="BuildYourStore">
    <svg width="26" height="31" viewBox="0 0 28 33" fill="none" aria-hidden="true">
      <path d="M1.88432 9.57007C2.10387 7.53917 3.81841 6 5.86115 6H22.1389C24.1816 6 25.8961 7.53917 26.1157 9.57007L27.5211 22.5701C27.7768 24.9356 25.9236 27 23.5443 27H4.45574C2.07644 27 0.22318 24.9356 0.478911 22.5701L1.88432 9.57007Z" fill="#009A7B"></path>
      <path d="M21 12C21 15.866 17.866 19 14 19C10.134 19 7 15.866 7 12" stroke="white" stroke-width="2.5" stroke-linecap="round"></path>
    </svg>
    <span class="logo-word">BUILD<em>YOUR</em>STORE</span>
  </a>
</div>

<main class="page">
  <div class="col">
    <span class="eyebrow">Your next step</span>

    <h1>
      <span class="ring" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
      </span>Answer the call.
    </h1>

    <div class="player" id="player">
      <video class="player-video" id="video" playsinline preload="metadata">
        <source src="thankyouv3.mp4" type="video/mp4">
      </video>
      <span class="player-art" aria-hidden="true"></span>
      <span class="player-copy" id="playerCopy">Play to unlock your free store</span>
      <button class="playbtn" id="playbtn" type="button" aria-label="Play the intro video">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.28-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14Z"/></svg>
      </button>
      <span class="track"><i id="bar"></i></span>
    </div>

    <button class="cta" id="cta" data-state="locked" disabled>
      <span id="ctaLabel">Claim My FREE Store</span>
      <span class="lock" id="lock">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span id="count"></span>
      </span>
    </button>

    <div class="points">
      <div class="point">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M14 12h4"/></svg>
        <p>The call is free to pickup</p>
      </div>
      <div class="point">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/></svg>
        <p>Turn off Do Not Disturb</p>
      </div>
      <div class="point">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 10 5-10 5L2 9l10-5Z"/><path d="M6 11v4c0 1.66 2.69 3 6 3s6-1.34 6-3v-4"/></svg>
        <p>Get the full course on the call</p>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  /* Everything on this screen is driven by the <video> element itself:
     'loadedmetadata' fills the countdown, 'timeupdate' moves the bar, and
     'ended' unlocks the CTA. That lock is the mechanic of the screen.

     Playback is click-to-start rather than autoplay: the file carries sound,
     and a browser only permits sound on a freshly loaded document after a
     user gesture. */

  var video   = document.getElementById('video');
  var player  = document.getElementById('player');
  var playbtn = document.getElementById('playbtn');
  var bar     = document.getElementById('bar');
  var cta     = document.getElementById('cta');
  var label   = document.getElementById('ctaLabel');
  var count   = document.getElementById('count');

  function secs(n){ return Math.max(0, Math.ceil(n)); }
  function known(){ return isFinite(video.duration) && video.duration > 0; }

  video.addEventListener('loadedmetadata', function(){
    if (known()) count.textContent = secs(video.duration);
  });

  video.addEventListener('timeupdate', function(){
    if (!known()) return;
    bar.style.width = Math.min(100, (video.currentTime / video.duration) * 100) + '%';
    count.textContent = secs(video.duration - video.currentTime);
  });

  video.addEventListener('play',  function(){ player.classList.add('started','playing'); });
  video.addEventListener('pause', function(){ player.classList.remove('playing'); });

  video.addEventListener('ended', function(){
    player.classList.remove('playing');
    bar.style.width = '100%';
    count.textContent = '0';
    unlock();
  });

  function unlock(){
    if (cta.dataset.state === 'unlocked') return;
    cta.dataset.state = 'unlocked';
    cta.disabled = false;
    label.textContent = 'Claim My FREE Store  \u2192';
  }

  function toggle(){
    if (video.ended) video.currentTime = 0;
    if (video.paused){
      var playing = video.play();
      /* If the browser refuses, the artwork and the play button stay where they
         are, so the user still has something to press. */
      if (playing && playing.catch) playing.catch(function(){
        player.classList.remove('playing');
      });
    } else {
      video.pause();
    }
  }

  player.addEventListener('click', toggle);
  playbtn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });

  cta.addEventListener('click', function(){
    if (cta.dataset.state !== 'unlocked') return;
    label.textContent = 'Opening Shopify\u2026';
    // TODO: hand the user on to the Shopify "Claim your store" step.
  });
})();
</script>
</body>
</html>
